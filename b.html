<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-LEAGUE — первая падел-лига Korta. Сезон 1</title>
    <meta name="description" content="K-LEAGUE, сезон 1: семь матчей за восемь недель, один матч в неделю, четыре дивизиона по уровню. Старт 3 октября.">

    <!-- Короткая ссылка для блогеров: korta.me/b?nickname уводит на страницу лиги
         с метками utm. Страница настоящая (200) и с теми же og-тегами, что у лиги,
         поэтому превью в Telegram и мессенджерах показывает карточку лиги, а не ошибку.
         Счётчик Метрики сюда намеренно не ставим: визит должен засчитаться один раз,
         уже на /league с метками. -->
    <meta name="robots" content="noindex, follow">
    <meta name="referrer" content="no-referrer">
    <link rel="canonical" href="https://korta.me/league">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://korta.me/league">
    <meta property="og:title" content="K-LEAGUE — первая падел-лига Korta. Сезон 1">
    <meta property="og:description" content="Семь матчей за восемь недель, один матч в неделю, соперники своего уровня, призы на сумму 500 000 ₽. Старт 3 октября, K-Day 5 декабря, призы за первые три места.">
    <meta property="og:image" content="https://korta.me/og/league-banner.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:site_name" content="Korta.me">
    <meta property="og:locale" content="ru_RU">

    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">

    <!-- Запасной путь, если JavaScript выключен: метка теряется, но человек доходит.
         С включённым JS скрипт ниже срабатывает раньше и подставляет метки. -->
    <meta http-equiv="refresh" content="3; url=/league">

    <script>
        (function () {
            /* ник берём из ?nickname, ?i=nickname или ?u=nickname */
            var raw = location.search.replace(/^\?/, '');
            if (!raw) { location.replace('/league' + location.hash); return; }

            var value = raw;
            var pair = /^(?:i|u|utm_source)=(.*)$/i.exec(raw.split('&')[0]);
            if (pair) value = pair[1];

            try { value = decodeURIComponent(value); } catch (e) {}
            value = value.toLowerCase();

            /* кириллический ник иначе вычистился бы в пустоту и метка потерялась бы молча */
            var translit = {
                'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z',
                'и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r',
                'с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sch',
                'ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'
            };
            value = value.replace(/[а-яё]/g, function (ch) { return translit[ch] || ''; });

            /* в адрес уходит только то, что мы сами разрешили */
            var source = value.replace(/[^a-z0-9_.-]/g, '').slice(0, 40);
            if (!source) { location.replace('/league' + location.hash); return; }

            location.replace(
                '/league?utm_source=' + source +
                '&utm_medium=blogger&utm_campaign=kleague_s1' + location.hash
            );
        })();
    </script>

    <style>
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: 'Inter var', Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff; color: #18181b; text-align: center; padding: 24px;
        }
        a { color: #0bb951; font-weight: 600; }
    </style>
</head>
<body>
    <div>
        <p style="font-size: 17px; line-height: 1.5; margin: 0;">Открываем страницу K-LEAGUE…</p>
        <p style="font-size: 15px; line-height: 1.5; margin: 12px 0 0; color: #52525b;">
            Если ничего не произошло — <a href="/league">перейдите вручную</a>.
        </p>
    </div>
</body>
</html>
